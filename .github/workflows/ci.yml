name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The NAS client's tests talk to a real Samba server on this machine.
      - name: Start a Samba server for the NAS tests
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends samba
          scripts/samba-test-server.sh start /tmp/discrip-samba >> "$GITHUB_ENV"
      - name: Test platform-independent core, the NAS client against Samba
        run: ./gradlew -p core test smbTest
      - name: Upload core test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/

  native:
    name: Rip engine tests on the build machine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # man-db rebuilds its index after every install, which takes many minutes on the runners.
      - name: Install the tools for the test DVD
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg dvdauthor genisoimage ninja-build nasm
      # The scripts keep a fingerprint, so a restored build that no longer matches is rebuilt.
      - name: Cache third-party sources and the host FFmpeg build
        uses: actions/cache@v6
        with:
          path: |
            native/third_party
            native/build/ffmpeg/host
          key: native-host-${{ hashFiles('native/scripts/fetch-sources.sh', 'native/scripts/build-ffmpeg.sh') }}
      - name: Build the engine and run its tests, plain and with sanitizers
        run: native/scripts/test-engine.sh

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache third-party sources and the Android FFmpeg build
        uses: actions/cache@v6
        with:
          path: |
            native/third_party
            native/build/ffmpeg/android
          key: native-android-${{ hashFiles('native/scripts/fetch-sources.sh', 'native/scripts/build-ffmpeg.sh') }}
      - name: Unit tests, debug and release APKs, lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --warning-mode all 2>&1 | tee gradle-output.log
      - name: Show Gradle deprecation warnings
        if: always()
        run: |
          grep -iE "deprecat|scheduled to be removed" gradle-output.log | grep -vE '^[[:space:]]+at ' \
            | sort | uniq -c | sort -rn > deprecations.txt || true
          if [ -s deprecations.txt ]; then head -n 60 deprecations.txt; else echo "No deprecation warnings."; fi
      - name: Show lint findings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "No lint report was written."
      - name: Check 16 KB page alignment of native libraries
        run: python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
      # The native code finds its Kotlin callbacks by name; R8 must not drop or rename them.
      - name: Check that the release build keeps the callbacks of the native code
        run: python3 scripts/check_jni_keep.py app/build/outputs/apk/release/app-release.apk app/src/main/cpp
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: discrip-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented:
    name: Instrumented tests on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # man-db rebuilds its index after every install, which takes many minutes on the runners.
      - name: Install the tools for the test DVD and Samba
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg dvdauthor genisoimage samba
      # The NAS tests on the emulator reach this machine's Samba server as 10.0.2.2.
      - name: Start a Samba server for the NAS tests
        run: scripts/samba-test-server.sh start /tmp/discrip-samba >> "$GITHUB_ENV"
      - name: Cache third-party sources and the Android FFmpeg build
        uses: actions/cache@v6
        with:
          path: |
            native/third_party
            native/build/ffmpeg/android
          key: native-android-${{ hashFiles('native/scripts/fetch-sources.sh', 'native/scripts/build-ffmpeg.sh') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app, its instrumented tests and the release build
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      # The emulator wants 1.2 times its 6 GB data partition free (7.4 GB), about what the runner
      # has left after the native build; smaller partitions (the action's disk-size input, the
      # emulator's -partition-size) did not take effect. Toolchains this job never uses free 14 GB.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      # The app is arm64-v8a only; x86_64 Google APIs images from API 30 on translate ARM code.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.smbHost=10.0.2.2
            -Pandroid.testInstrumentationRunnerArguments.smbPort=$DISCRIP_SMB_PORT
            -Pandroid.testInstrumentationRunnerArguments.smbShare=$DISCRIP_SMB_SHARE
            -Pandroid.testInstrumentationRunnerArguments.smbReadOnlyShare=$DISCRIP_SMB_READONLY_SHARE
            -Pandroid.testInstrumentationRunnerArguments.smbUser=$DISCRIP_SMB_USER
            -Pandroid.testInstrumentationRunnerArguments.smbPassword=$DISCRIP_SMB_PASSWORD
            && scripts/release-smoke-test.sh app/build/outputs/apk/release/app-release.apk
      # Skipped tests fail the job: here every test, the NAS ones included, must run.
      - name: Instrumented test results
        if: always()
        run: python3 scripts/test_summary.py --no-skipped app/build/outputs/androidTest-results/connected
      # LossyEndToEndTest leaves its "Gebalanceerd" rip behind for a second opinion from the full
      # FFmpeg installed above: codec, size, frames, and the aspect ratio in the stream itself.
      - name: Check the lossy rip with ffprobe
        run: python3 scripts/check_lossy_output.py app/build/outputs/connected_android_test_additional_output
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/

  dependencies:
    name: Dependency report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Newest stable versions of the catalog entries
        run: python3 scripts/dependency_report.py
